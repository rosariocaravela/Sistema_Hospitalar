spring.application.name=sistemaDeGestaoHospitalar

# Base de dados: configure os valores através de variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SistemaDeGestaoDeConsulta}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
server.port=${PORT:8080}

# Logging
logging.level.org.springframework=${SPRING_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}
